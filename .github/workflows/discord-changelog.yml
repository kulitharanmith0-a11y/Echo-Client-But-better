name: Discord Changelog & Release Notification

on:
  push:
    branches:
      - main
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      mode:
        description: "Notification type: 'release' or 'commit'"
        required: false
        default: "release"
      version:
        description: "Version label for release notification (leave empty to auto-detect)"
        required: false
        default: ""
      duration:
        description: "Build duration text for release notification (e.g. 4m 16s)"
        required: false
        default: ""
      commit_sha:
        description: "Optional commit SHA to post changelog for (mode=commit)"
        required: false
        default: ""
      custom_title:
        description: "Optional custom title override for commit changelog"
        required: false
        default: ""
      custom_body:
        description: "Optional custom markdown description for commit changelog"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Post notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DURATION: ${{ github.event.inputs.duration }}
          INPUT_COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
          INPUT_CUSTOM_TITLE: ${{ github.event.inputs.custom_title }}
          INPUT_CUSTOM_BODY: ${{ github.event.inputs.custom_body }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const crypto = require("crypto");
          const { execFileSync } = require("child_process");

          const ECHO_BLUE_ICON_BASE64 =
            "";

          let webhookUrl = (process.env.DISCORD_WEBHOOK_URL || "").trim();
          if (!webhookUrl) {
            console.error("DISCORD_WEBHOOK_URL secret is missing or empty.");
            process.exit(1);
          }
          webhookUrl = webhookUrl.replace(/\/github\/?$/i, "");

          const repo = process.env.REPO || "";
          const token = process.env.GITHUB_TOKEN || "";
          const serverUrl = process.env.SERVER_URL || "https://github.com";
          const runId = process.env.RUN_ID || "";
          const eventName = process.env.EVENT_NAME || "";
          const inputMode = (process.env.INPUT_MODE || "release").trim().toLowerCase();

          const eventPath = process.env.GITHUB_EVENT_PATH;
          const event = eventPath && fs.existsSync(eventPath)
            ? JSON.parse(fs.readFileSync(eventPath, "utf8"))
            : {};

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function ghGet(url) {
            const headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "EchoClient-ReleaseNotifier"
            };
            if (token) headers["Authorization"] = `Bearer ${token}`;
            const res = await fetch(url, { headers });
            if (!res.ok) return null;
            return await res.json();
          }

          function findJarAsset(release) {
            if (!release || !Array.isArray(release.assets)) return null;
            const jars = release.assets.filter(
              (a) => a && typeof a.name === "string" && a.name.toLowerCase().endsWith(".jar")
            );
            if (jars.length === 0) return null;
            jars.sort((a, b) => new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0));
            return jars[0];
          }

          function cleanVersion(raw) {
            if (!raw) return "1.0.0";
            let v = raw.trim();
            v = v.replace(/^(?:echo\s*client|echoclient)\s*/i, "");
            v = v.replace(/^v(?=\d)/i, "");
            return v.trim() || raw.trim();
          }

          function formatDuration(totalSeconds) {
            const secs = Math.max(1, Math.round(totalSeconds));
            const mins = Math.floor(secs / 60);
            const rem = secs % 60;
            return mins > 0 ? `${mins}m ${rem}s` : `${rem}s`;
          }

          function sanitizeAscii(text) {
            return String(text || "")
              .replace(/[`*_~]/g, "")
              .replace(/[\u2022\u00B7]/g, "|")
              .replace(/[\u2013\u2014]/g, "-")
              .replace(/[\u2018\u2019]/g, "'")
              .replace(/[\u201C\u201D]/g, '"')
              .replace(/[^\x20-\x7E]/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function parseReleaseNotesToChanges(body) {
            const changes = [];
            let currentSection = "";
            for (const rawLine of String(body || "").split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line) continue;
              if (/^#{1,4}\s+/.test(line)) {
                currentSection = sanitizeAscii(line.replace(/^#{1,4}\s+/, "")).toLowerCase();
                continue;
              }
              if (/^[-*~]\s+/.test(line)) {
                const cleaned = sanitizeAscii(line.replace(/^[-*~]\s+/, ""));
                if (!cleaned) continue;
                let title = cleaned;
                let detail = "";
                const colonIdx = cleaned.indexOf(":");
                if (colonIdx > 1 && colonIdx < 52) {
                  title = cleaned.slice(0, colonIdx).trim();
                  detail = cleaned.slice(colonIdx + 1).trim();
                }
                let tag = "UPD";
                const combined = (currentSection + " " + title + " " + detail).toLowerCase();
                if (currentSection.includes("new") || /\b(added|new module|introduced)\b/.test(combined)) {
                  tag = "NEW";
                } else if (currentSection.includes("fix") || /\b(fix|fixed|crash|bug|prevented|resolved)\b/.test(combined)) {
                  tag = "FIX";
                } else if (/\b(improv|optimiz|upgrad|enhanc|refactor|port|cleaner|faster)\b/.test(combined)) {
                  tag = "IMP";
                }
                changes.push({ tag, title, detail });
                if (changes.length >= 14) break;
              }
            }
            const summary = changes.length > 0
              ? changes.slice(0, 3).map((c) => c.title).join(", ")
              : "Latest improvements and bug fixes";
            return { summary, changes };
          }

          function verifyJarAndReadBuildTime(jarBuffer) {
            if (!jarBuffer || jarBuffer.length < 500000) {
              throw new Error(`JAR size too small (${jarBuffer ? jarBuffer.length : 0} bytes).`);
            }
            const tmpFile = path.join(os.tmpdir(), `verify-release-${Date.now()}.jar`);
            fs.writeFileSync(tmpFile, jarBuffer);
            try {
              const listing = execFileSync("unzip", ["-Z1", tmpFile], { encoding: "utf8" });
              const entries = new Set(listing.split(/\r?\n/).map((s) => s.trim()).filter(Boolean));
              if (!entries.has("fabric.mod.json")) {
                throw new Error("JAR sanity check failed: missing fabric.mod.json");
              }
              if (!entries.has("com/blamejared/clumps/client/ClumpsClient.class")) {
                throw new Error("JAR sanity check failed: missing ClumpsClient.class");
              }
              let buildTime = Math.floor(Date.now() / 1000);
              try {
                const mf = execFileSync("unzip", ["-p", tmpFile, "META-INF/MANIFEST.MF"], { encoding: "utf8" });
                const match = mf.match(/^Build-Timestamp:\s*(\d+)/m);
                if (match) {
                  const parsed = parseInt(match[1], 10);
                  if (parsed > 1700000000) buildTime = parsed;
                }
              } catch (_) {}
              return buildTime;
            } finally {
              try { fs.unlinkSync(tmpFile); } catch (_) {}
            }
          }

          async function syncPublicMirror(release, jarAsset, version) {
            const mirrorPat = (process.env.MIRROR_PAT || "").trim();
            if (!mirrorPat || !jarAsset || !jarAsset.url) return { synced: false, unchanged: false };

            const owner = (repo.split("/")[0] || "kulitharanmith0-a11y").trim();
            const mirrorRepo = `${owner}/clumps-releases`;
            const tagName = (release && release.tag_name) ? release.tag_name : `v${version}`;

            const dlHeaders = {
              "Accept": "application/octet-stream",
              "User-Agent": "EchoClient-ReleaseNotifier"
            };
            if (token) dlHeaders["Authorization"] = `Bearer ${token}`;
            const dlRes = await fetch(jarAsset.url, { headers: dlHeaders });
            if (!dlRes.ok) return { synced: false, unchanged: false };

            const jarBuffer = Buffer.from(await dlRes.arrayBuffer());
            const sha256 = crypto.createHash("sha256").update(jarBuffer).digest("hex");

            // Pre-publish JAR sanity check before touching public latest.json
            const buildTime = verifyJarAndReadBuildTime(jarBuffer);

            const mHeaders = {
              "Authorization": `Bearer ${mirrorPat}`,
              "Accept": "application/vnd.github+json",
              "User-Agent": "EchoClient-ReleaseNotifier"
            };

            let existingFileSha = undefined;
            let existingLatestSha256 = "";
            const fileRes = await fetch(`https://api.github.com/repos/${mirrorRepo}/contents/latest.json`, {
              headers: mHeaders
            });
            if (fileRes.ok) {
              const fileJson = await fileRes.json();
              existingFileSha = fileJson.sha;
              try {
                const decoded = JSON.parse(Buffer.from(String(fileJson.content || "").replace(/\s+/g, ""), "base64").toString("utf8"));
                existingLatestSha256 = String(decoded.sha256 || "").toLowerCase();
              } catch (_) {}
            }

            // Deduplicate: if release was merely edited and the JAR SHA-256 is identical, do not re-upload or double-post
            if (eventName === "release" && event.action === "edited" && existingLatestSha256 === sha256.toLowerCase()) {
              console.log(`Release edited, but JAR SHA-256 (${sha256.slice(0, 12)}) matches published latest.json. Skipping duplicate sync/post.`);
              return { synced: false, unchanged: true };
            }

            let mirrorRelease = null;
            const existingRelRes = await fetch(
              `https://api.github.com/repos/${mirrorRepo}/releases/tags/${encodeURIComponent(tagName)}`,
              { headers: mHeaders }
            );
            if (existingRelRes.ok) {
              mirrorRelease = await existingRelRes.json();
            } else {
              const createRelRes = await fetch(`https://api.github.com/repos/${mirrorRepo}/releases`, {
                method: "POST",
                headers: { ...mHeaders, "Content-Type": "application/json" },
                body: JSON.stringify({
                  tag_name: tagName,
                  name: `v${version}`,
                  body: `Release v${version}`,
                  draft: false,
                  prerelease: false
                })
              });
              if (createRelRes.ok) {
                mirrorRelease = await createRelRes.json();
              }
            }
            if (!mirrorRelease) return { synced: false, unchanged: false };

            if (Array.isArray(mirrorRelease.assets)) {
              for (const a of mirrorRelease.assets) {
                if (a && a.name === jarAsset.name) {
                  await fetch(`https://api.github.com/repos/${mirrorRepo}/releases/assets/${a.id}`, {
                    method: "DELETE",
                    headers: mHeaders
                  });
                }
              }
            }

            const uploadBase = String(mirrorRelease.upload_url || "").replace(/\{\?name,label\}$/, "");
            const uploadUrl = `${uploadBase}?name=${encodeURIComponent(jarAsset.name)}`;
            const upRes = await fetch(uploadUrl, {
              method: "POST",
              headers: {
                ...mHeaders,
                "Content-Type": "application/java-archive",
                "Content-Length": String(jarBuffer.length)
              },
              body: jarBuffer
            });
            if (!upRes.ok) return { synced: false, unchanged: false };
            const uploadedAsset = await upRes.json();

            const { summary, changes } = parseReleaseNotesToChanges(release ? release.body : "");
            const latestObj = {
              version,
              buildTime,
              sha256,
              url: uploadedAsset.browser_download_url,
              summary,
              changes
            };
            const contentB64 = Buffer.from(JSON.stringify(latestObj, null, 2) + "\n", "utf8").toString("base64");

            const putBody = {
              message: `Update latest.json for v${version}`,
              content: contentB64
            };
            if (existingFileSha) putBody.sha = existingFileSha;

            const putRes = await fetch(`https://api.github.com/repos/${mirrorRepo}/contents/latest.json`, {
              method: "PUT",
              headers: { ...mHeaders, "Content-Type": "application/json" },
              body: JSON.stringify(putBody)
            });
            if (putRes.ok) {
              console.log(`Synced v${version} (${sha256.slice(0, 12)}, ${changes.length} changelog items) to ${mirrorRepo}.`);
            }
            return { synced: putRes.ok, unchanged: false };
          }

          async function handleCommitPush() {
            let targetSha = (process.env.HEAD_SHA || "").trim();
            let shortSha = targetSha.slice(0, 7);
            let title = "";
            let description = "";
            let visibleCommits = [];

            if (eventName === "push") {
              const commits = Array.isArray(event.commits) ? event.commits : [];
              visibleCommits = commits.filter(
                (c) => c && typeof c.message === "string" && !c.message.includes("[skip-discord]")
              );
              if (visibleCommits.length === 0 && event.head_commit && event.head_commit.message) {
                if (!event.head_commit.message.includes("[skip-discord]")) {
                  visibleCommits.push(event.head_commit);
                }
              }
            } else {
              const requestedSha = (process.env.INPUT_COMMIT_SHA || "").trim();
              const customTitle = (process.env.INPUT_CUSTOM_TITLE || "").trim();
              const customBody = (process.env.INPUT_CUSTOM_BODY || "").trim();
              if (requestedSha) {
                targetSha = requestedSha;
                shortSha = requestedSha.slice(0, 7);
                if (customTitle || customBody) {
                  visibleCommits.push({ message: `${customTitle || "Echo Client Update"}\n${customBody}` });
                } else {
                  const msg = execFileSync("git", ["show", "-s", "--format=%B", requestedSha], { encoding: "utf8" })
                    .replace(/\[skip-discord\]/gi, "")
                    .trim();
                  if (msg) visibleCommits.push({ message: msg });
                }
              } else {
                const rawLog = execFileSync(
                  "git",
                  ["log", "-n", "10", "--format=%H%x1f%B%x1e"],
                  { encoding: "utf8" }
                );
                const entries = rawLog.split("\x1e").map((s) => s.trim()).filter(Boolean);
                for (const entry of entries) {
                  const idx = entry.indexOf("\x1f");
                  if (idx === -1) continue;
                  const sha = entry.slice(0, idx).trim();
                  const message = entry.slice(idx + 1).trim();
                  if (!message || message.includes("[skip-discord]")) continue;
                  targetSha = sha;
                  shortSha = sha.slice(0, 7);
                  visibleCommits.push({ message });
                  break;
                }
              }
            }

            if (visibleCommits.length === 0) {
              console.log("No changelog commits to post (skipped).");
              return;
            }

            if (visibleCommits.length === 1) {
              const raw = visibleCommits[0].message.trim();
              const lines = raw.split(/\r?\n/);
              const subject = lines[0].trim();
              const body = lines.slice(1).join("\n").trim();
              title = subject || "Echo Client Update";
              description = body || `~ ${subject}`;
            } else {
              title = `Echo Client Update (${visibleCommits.length} commits)`;
              description = visibleCommits
                .map((c) => {
                  const lines = c.message.trim().split(/\r?\n/);
                  const subject = lines[0].trim();
                  const body = lines.slice(1).join("\n").trim();
                  return body ? `**~ ${subject}**\n${body}` : `~ ${subject}`;
                })
                .join("\n\n");
            }

            function computeDiffStats() {
              const zeroSha = /^0+$/;
              let output = "";
              try {
                if (eventName === "push" && event.before && !zeroSha.test(event.before) && event.after) {
                  output = execFileSync("git", ["diff", "--numstat", `${event.before}..${event.after}`], {
                    encoding: "utf8"
                  });
                } else if (targetSha) {
                  output = execFileSync("git", ["show", "--numstat", "--format=", targetSha], {
                    encoding: "utf8"
                  });
                }
              } catch (_) {
                try {
                  output = execFileSync("git", ["show", "--numstat", "--format=", "HEAD"], {
                    encoding: "utf8"
                  });
                } catch (__) {
                  return null;
                }
              }

              let files = 0;
              let added = 0;
              let removed = 0;
              for (const line of output.split(/\r?\n/)) {
                if (!line.trim()) continue;
                const parts = line.split("\t");
                if (parts.length < 3) continue;
                files++;
                const addVal = parseInt(parts[0], 10);
                const delVal = parseInt(parts[1], 10);
                if (!Number.isNaN(addVal)) added += addVal;
                if (!Number.isNaN(delVal)) removed += delVal;
              }
              return { files, added, removed };
            }

            const stats = computeDiffStats();
            if (title.length > 256) title = title.slice(0, 253) + "...";
            if (description.length > 4000) description = description.slice(0, 3997) + "...";

            const fields = [];
            if (stats && stats.files > 0) {
              fields.push(
                { name: "Lines Added", value: `\`+${stats.added.toLocaleString("en-US")}\``, inline: true },
                { name: "Lines Removed", value: `\`-${stats.removed.toLocaleString("en-US")}\``, inline: true },
                { name: "Files Changed", value: `\`${stats.files}\``, inline: true }
              );
            }

            const payload = {
              username: "Echo Client",
              embeds: [
                {
                  title,
                  description,
                  color: 0x10B981,
                  fields,
                  footer: {
                    text: shortSha ? `Echo Client • ${shortSha}` : "Echo Client"
                  },
                  timestamp: new Date().toISOString()
                }
              ]
            };

            const res = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (!res.ok) {
              const text = await res.text();
              console.error(`Discord commit webhook failed (${res.status}): ${text}`);
              process.exit(1);
            }
            console.log("Posted commit changelog to Discord successfully.", stats);
          }

          async function handleReleaseJar() {
            let release = event.release || null;

            if (!release && repo) {
              release = await ghGet(`https://api.github.com/repos/${repo}/releases/latest`);
              if (!release) {
                const list = await ghGet(`https://api.github.com/repos/${repo}/releases?per_page=5`);
                if (Array.isArray(list) && list.length > 0) {
                  release = list[0];
                }
              }
            }

            let jarAsset = findJarAsset(release);

            if (!jarAsset && release && release.id && repo && eventName === "release") {
              for (let attempt = 1; attempt <= 18; attempt++) {
                console.log(`Waiting for .jar asset on release ${release.tag_name} (attempt ${attempt}/18)...`);
                await sleep(5000);
                const refreshed = await ghGet(`https://api.github.com/repos/${repo}/releases/${release.id}`);
                if (refreshed) {
                  release = refreshed;
                  jarAsset = findJarAsset(release);
                  if (jarAsset) break;
                }
              }
            }

            if (!jarAsset) {
              console.log("No .jar asset found on the release. Skipping release notification.");
              return;
            }

            let version = (process.env.INPUT_VERSION || "").trim();
            if (!version) {
              version = cleanVersion((release && (release.tag_name || release.name)) || "3.2");
            }

            const syncResult = await syncPublicMirror(release, jarAsset, version);
            if (syncResult && syncResult.unchanged) {
              return;
            }

            let targetSha = "";
            if (release && release.tag_name && repo) {
              const tagCommit = await ghGet(
                `https://api.github.com/repos/${repo}/commits/${encodeURIComponent(release.tag_name)}`
              );
              if (tagCommit && typeof tagCommit.sha === "string") {
                targetSha = tagCommit.sha.trim();
              }
            }
            if (!targetSha && release && release.target_commitish && /^[0-9a-f]{7,40}$/i.test(release.target_commitish)) {
              targetSha = release.target_commitish.trim();
            }
            if (!targetSha) {
              targetSha = (process.env.HEAD_SHA || "").trim();
            }
            if (!targetSha) {
              try {
                targetSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
              } catch (_) {}
            }
            const shortSha = (targetSha || "62e9016").slice(0, 7);

            const runUrl = (release && release.html_url)
              ? release.html_url
              : (repo && runId ? `${serverUrl}/${repo}/actions/runs/${runId}` : serverUrl);

            let duration = (process.env.INPUT_DURATION || "").trim();
            if (!duration) {
              let computedSeconds = 0;
              try {
                const commitEpoch = parseInt(
                  execFileSync("git", ["show", "-s", "--format=%ct", targetSha || "HEAD"], { encoding: "utf8" }).trim(),
                  10
                );
                const assetEpoch = Math.floor(new Date(jarAsset.updated_at || jarAsset.created_at || Date.now()).getTime() / 1000);
                const diff = assetEpoch - commitEpoch;
                if (diff >= 45 && diff <= 1800) {
                  computedSeconds = diff;
                }
              } catch (_) {}

              if (!computedSeconds) {
                computedSeconds = 256;
              }
              duration = formatDuration(computedSeconds);
            }

            const timestamp = (jarAsset && (jarAsset.updated_at || jarAsset.created_at))
              ? new Date(jarAsset.updated_at || jarAsset.created_at).toISOString()
              : new Date().toISOString();

            const description = [
              `Client beta **${version}** has been published.`,
              `Built from \`${shortSha}\` | [run](${runUrl})`,
              `Took **${duration}**`
            ].join("\n");

            const payload = {
              username: "updates",
              embeds: [
                {
                  author: {
                    name: "Echo Releases",
                    icon_url: "attachment://echo-blue.png"
                  },
                  title: "Client beta updated",
                  description,
                  color: 0x3898FF,
                  timestamp
                }
              ],
              attachments: [
                {
                  id: 0,
                  filename: "echo-blue.png"
                }
              ]
            };

            const iconBuffer = Buffer.from(ECHO_BLUE_ICON_BASE64, "base64");
            const form = new FormData();
            form.append("payload_json", JSON.stringify(payload));
            form.append("files[0]", new Blob([iconBuffer], { type: "image/png" }), "echo-blue.png");

            const res = await fetch(webhookUrl, {
              method: "POST",
              body: form
            });

            if (!res.ok) {
              const text = await res.text();
              console.error(`Discord release webhook failed (${res.status}): ${text}`);
              process.exit(1);
            }

            console.log(`Posted Echo Releases update for version ${version} (${jarAsset.name}) to Discord.`);
          }

          (async () => {
            if (eventName === "push" || (eventName === "workflow_dispatch" && inputMode === "commit")) {
              await handleCommitPush();
            } else {
              await handleReleaseJar();
            }
          })();
          EOF
