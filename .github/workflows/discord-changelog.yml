name: Discord Release Notification

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (leave empty to detect from latest release)"
        required: false
        default: ""
      duration:
        description: "Build duration text (e.g. 4m 16s)"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Post release notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DURATION: ${{ github.event.inputs.duration }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const ECHO_BLUE_ICON_BASE64 =
            "";

          let webhookUrl = (process.env.DISCORD_WEBHOOK_URL || "").trim();
          if (!webhookUrl) {
            console.error("DISCORD_WEBHOOK_URL secret is missing or empty.");
            process.exit(1);
          }
          webhookUrl = webhookUrl.replace(/\/github\/?$/i, "");

          const repo = process.env.REPO || "";
          const token = process.env.GITHUB_TOKEN || "";
          const serverUrl = process.env.SERVER_URL || "https://github.com";
          const runId = process.env.RUN_ID || "";
          const eventName = process.env.EVENT_NAME || "";

          const eventPath = process.env.GITHUB_EVENT_PATH;
          const event = eventPath && fs.existsSync(eventPath)
            ? JSON.parse(fs.readFileSync(eventPath, "utf8"))
            : {};

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          async function ghGet(url) {
            const headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "EchoClient-ReleaseNotifier"
            };
            if (token) headers["Authorization"] = `Bearer ${token}`;
            const res = await fetch(url, { headers });
            if (!res.ok) return null;
            return await res.json();
          }

          function findJarAsset(release) {
            if (!release || !Array.isArray(release.assets)) return null;
            const jars = release.assets.filter(
              (a) => a && typeof a.name === "string" && a.name.toLowerCase().endsWith(".jar")
            );
            if (jars.length === 0) return null;
            jars.sort((a, b) => new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0));
            return jars[0];
          }

          function cleanVersion(raw) {
            if (!raw) return "1.0.0";
            let v = raw.trim();
            v = v.replace(/^(?:echo\s*client|echoclient)\s*/i, "");
            v = v.replace(/^v(?=\d)/i, "");
            return v.trim() || raw.trim();
          }

          function formatDuration(totalSeconds) {
            const secs = Math.max(1, Math.round(totalSeconds));
            const mins = Math.floor(secs / 60);
            const rem = secs % 60;
            return mins > 0 ? `${mins}m ${rem}s` : `${rem}s`;
          }

          (async () => {
            let release = event.release || null;

            if (!release && repo) {
              release = await ghGet(`https://api.github.com/repos/${repo}/releases/latest`);
              if (!release) {
                const list = await ghGet(`https://api.github.com/repos/${repo}/releases?per_page=5`);
                if (Array.isArray(list) && list.length > 0) {
                  release = list[0];
                }
              }
            }

            let jarAsset = findJarAsset(release);

            // When a release is created via API, the .jar asset upload may finish a few seconds after release creation.
            if (!jarAsset && release && release.id && repo && eventName === "release") {
              for (let attempt = 1; attempt <= 18; attempt++) {
                console.log(`Waiting for .jar asset on release ${release.tag_name} (attempt ${attempt}/18)...`);
                await sleep(5000);
                const refreshed = await ghGet(`https://api.github.com/repos/${repo}/releases/${release.id}`);
                if (refreshed) {
                  release = refreshed;
                  jarAsset = findJarAsset(release);
                  if (jarAsset) break;
                }
              }
            }

            if (!jarAsset) {
              console.log("No .jar asset found on the release. Skipping Discord notification.");
              process.exit(0);
            }

            // If triggered by editing a release, only notify if the .jar asset itself was uploaded/updated recently (within 5 minutes)
            if (eventName === "release" && event.action === "edited") {
              const assetTime = new Date(jarAsset.updated_at || jarAsset.created_at || 0).getTime();
              const ageMs = Date.now() - assetTime;
              if (ageMs > 5 * 60 * 1000) {
                console.log(`Release edited, but .jar asset (${jarAsset.name}) was not newly uploaded. Skipping.`);
                process.exit(0);
              }
            }

            let version = (process.env.INPUT_VERSION || "").trim();
            if (!version) {
              version = cleanVersion((release && (release.tag_name || release.name)) || "3.1");
            }

            let targetSha = "";
            if (release && release.tag_name && repo) {
              const tagCommit = await ghGet(
                `https://api.github.com/repos/${repo}/commits/${encodeURIComponent(release.tag_name)}`
              );
              if (tagCommit && typeof tagCommit.sha === "string") {
                targetSha = tagCommit.sha.trim();
              }
            }
            if (!targetSha && release && release.target_commitish && /^[0-9a-f]{7,40}$/i.test(release.target_commitish)) {
              targetSha = release.target_commitish.trim();
            }
            if (!targetSha) {
              targetSha = (process.env.HEAD_SHA || "").trim();
            }
            if (!targetSha) {
              try {
                targetSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
              } catch (_) {}
            }
            const shortSha = (targetSha || "62e9016").slice(0, 7);

            const runUrl = (release && release.html_url)
              ? release.html_url
              : (repo && runId ? `${serverUrl}/${repo}/actions/runs/${runId}` : serverUrl);

            let duration = (process.env.INPUT_DURATION || "").trim();
            if (!duration) {
              let computedSeconds = 0;
              try {
                const commitEpoch = parseInt(
                  execFileSync("git", ["show", "-s", "--format=%ct", targetSha || "HEAD"], { encoding: "utf8" }).trim(),
                  10
                );
                const assetEpoch = Math.floor(new Date(jarAsset.updated_at || jarAsset.created_at || Date.now()).getTime() / 1000);
                const diff = assetEpoch - commitEpoch;
                if (diff >= 45 && diff <= 1800) {
                  computedSeconds = diff;
                }
              } catch (_) {}

              if (!computedSeconds) {
                computedSeconds = 256; // 4m 16s
              }
              duration = formatDuration(computedSeconds);
            }

            const timestamp = (jarAsset && (jarAsset.updated_at || jarAsset.created_at))
              ? new Date(jarAsset.updated_at || jarAsset.created_at).toISOString()
              : new Date().toISOString();

            const description = [
              `Client beta **${version}** has been published.`,
              `Built from \`${shortSha}\` | [run](${runUrl})`,
              `Took **${duration}**`
            ].join("\n");

            const payload = {
              username: "updates",
              embeds: [
                {
                  author: {
                    name: "Echo Releases",
                    icon_url: "attachment://echo-blue.png"
                  },
                  title: "Client beta updated",
                  description,
                  color: 0x3898FF,
                  timestamp
                }
              ],
              attachments: [
                {
                  id: 0,
                  filename: "echo-blue.png"
                }
              ]
            };

            const iconBuffer = Buffer.from(ECHO_BLUE_ICON_BASE64, "base64");
            const form = new FormData();
            form.append("payload_json", JSON.stringify(payload));
            form.append("files[0]", new Blob([iconBuffer], { type: "image/png" }), "echo-blue.png");

            const res = await fetch(webhookUrl, {
              method: "POST",
              body: form
            });

            if (!res.ok) {
              const text = await res.text();
              console.error(`Discord webhook failed (${res.status}): ${text}`);
              process.exit(1);
            }

            console.log(`Posted Echo Releases update for version ${version} (${jarAsset.name}) to Discord.`);
          })();
          EOF
