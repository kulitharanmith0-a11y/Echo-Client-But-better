buildscript {
    configurations.classpath.resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') details.useVersion('9.10.1')
    }
}

plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id 'java'
}

group = 'com.blamejared.clumps'
version = providers.gradleProperty('mod_version').get()
description = 'Clumps'

base { archivesName = 'Clumps-fabric-1.21.11-29.0.0.1' }

def devDiagnosticsEnabled = providers.gradleProperty('devDiagnostics').orElse('false').get().toBoolean()
def obfuscateEnabled = !devDiagnosticsEnabled && providers.gradleProperty('obfuscate').orElse('true').get().toBoolean()
// Skidfuscator 2.0.11's MapleIR lifter unconditionally drops FNEG/DNEG unary negation opcodes
// even with all transformers disabled, corrupting rotation & trajectory math. Keep disabled by default;
// Stages 1-4 (ProGuard 2-pass optimization + homoglyph flattening + Stage 2b cache-free StringEncryption +
// Stage 3a IEEE-754 bit-exact ConstantAndFlowPass + Stage 3b Mixin obfuscation + Stage 2a Asset Vault)
// provide full zero-leak obfuscation with 100% bit-exact JVM semantics.
def skidfuscatorEnabled = obfuscateEnabled && providers.gradleProperty('skidfuscator').orElse('false').get().toBoolean()

// Loom finalizes archive names in its own afterEvaluate, so the version suffix
// is stripped after that runs: the release artifact is
// build/libs/Clumps-fabric-1.21.11-29.0.0.1.jar with no -<version> tail.
afterEvaluate {
    def buildEpoch = String.valueOf(System.currentTimeMillis().intdiv(1000L))
    def releaseVer = providers.gradleProperty('client_release').orElse('3.6.1').get()
    tasks.withType(Jar).configureEach {
        archiveVersion = ''
        manifest {
            attributes(
                    'Build-Timestamp': buildEpoch,
                    'Build-Release': releaseVer
            )
        }
    }
    if (obfuscateEnabled) {
        def preProguardJar = tasks.named('jar').flatMap { it.archiveFile }
        def preProguardDep = tasks.named('jar')
        if (skidfuscatorEnabled) {
            def skidfuscateJar = tasks.register('skidfuscateJar', com.blamejared.obf.SkidfuscatorObfuscateTask) {
                dependsOn(tasks.named('jar'))
                inputJar.set(tasks.named('jar').flatMap { it.archiveFile })
                libraryClasspath.from(configurations.compileClasspath)
                outputJar.set(layout.buildDirectory.file('obfuscation/skidfuscated-yarn.jar'))
            }
            preProguardJar = skidfuscateJar.flatMap { it.outputJar }
            preProguardDep = skidfuscateJar
        }
        def proguardJar = tasks.register('proguardJar', com.blamejared.obf.ProguardObfuscateTask) {
            dependsOn(preProguardDep)
            inputJar.set(preProguardJar)
            libraryClasspath.from(configurations.compileClasspath)
            dictionarySeed.set(releaseVer.hashCode().toLong() ^ 0x4C554D50533631L)
            skipOptimization.set(skidfuscatorEnabled)
            outputJar.set(layout.buildDirectory.file('obfuscation/proguarded-yarn.jar'))
            mappingFile.set(layout.buildDirectory.file('obfuscation/mapping.txt'))
        }
        tasks.matching { it.name == 'remapJar' }.configureEach {
            dependsOn(proguardJar)
            inputFile.set(proguardJar.flatMap { it.outputJar })
            destinationDirectory.set(layout.buildDirectory.dir('obfuscation'))
            archiveFileName = 'remapped-raw.jar'
        }
        def hardenObfuscatedJar = tasks.register('hardenObfuscatedJar', com.blamejared.obf.HardenAndVerifyJarTask) {
            dependsOn(tasks.named('remapJar'))
            inputJar.set(tasks.named('remapJar').flatMap { it.archiveFile })
            outputJar.set(layout.buildDirectory.file('libs/Clumps-fabric-1.21.11-29.0.0.1.jar'))
            buildSalt.set(releaseVer.hashCode().toLong() ^ 0x7A2F91D3C5E14B09L)
        }
        tasks.named('remapJar') { finalizedBy(hardenObfuscatedJar) }
        tasks.named('assemble') { dependsOn(hardenObfuscatedJar) }
    } else {
        tasks.matching { it.name == 'remapJar' }.configureEach {
            archiveFileName = 'Clumps-fabric-1.21.11-29.0.0.1.jar'
        }
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
            content { includeGroupByRegex 'net\\.fabricmc.*'; includeGroup 'io.github.llamalad7' }
        }
        maven {
            name = 'MinecraftLibraries'
            url = uri('https://libraries.minecraft.net/')
            content { includeGroup 'com.mojang' }
        }
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }
}

// Every module's output lands inside the single root build/ tree, so one
// build directory exists and one `gradle clean` removes the whole thing.
subprojects { sub ->
    sub.layout.buildDirectory = rootProject.layout.buildDirectory.dir("modules/${sub.name}")
}

def includeSourcesJar = providers.gradleProperty('includeSources').orElse('false').get().toBoolean()

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    if (includeSourcesJar) {
        withSourcesJar()
    }
}

loom {
    // Source and resources are named Yarn. Loom alone performs ordinary release remapping.
    runs {
        client { runDir = 'run' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
    // Loader 0.19.3 embeds and declares 0.5.4 in fabric-installer.json.
    implementation 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    compileOnly 'org.jetbrains:annotations:26.0.2'

    // These ordinary source projects package only public upstream library code
    // plus their seven readable patches. No recovered application JAR is involved.
    implementation project(':libs:jsvg')
    implementation project(':libs:rhino')
    include project(':libs:jsvg')
    include project(':libs:rhino')

    testImplementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'

    // Launcher-provided Minecraft libraries used during compilation.
    compileOnly 'com.google.code.gson:gson:2.13.2'
    compileOnly 'com.google.guava:guava:33.5.0-jre'
    compileOnly 'com.mojang:authlib:7.0.61'
    compileOnly 'com.mojang:logging:1.6.11'
    compileOnly 'it.unimi.dsi:fastutil:8.5.18'
    compileOnly 'org.joml:joml:1.10.8'
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.25.2'
    compileOnly 'commons-io:commons-io:2.20.0'
    compileOnly 'org.apache.commons:commons-lang3:3.19.0'
    compileOnly 'io.netty:netty-buffer:4.2.7.Final'
    compileOnly 'io.netty:netty-transport:4.2.7.Final'
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-stb', 'lwjgl-tinyfd'].each { module ->
        compileOnly "org.lwjgl:${module}:${lwjgl_version}"
    }
}

// The patch projects publish complete dependency JARs, while their classes
// directories contain only the seven edits. Select the JAR variant explicitly.
configurations.named('compileClasspath') {
    attributes.attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
            objects.named(LibraryElements, LibraryElements.JAR))
}

sourceSets {
    main {
        java.setSrcDirs(devDiagnosticsEnabled ? ['src/main/java', 'src/dev/java'] : ['src/main/java', 'src/prod/java'])
        resources.setSrcDirs(['src/main/resources'])
    }
}

tasks.named('processResources') {
    exclude '**/*.txt'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.memoryMaximumSize = '512m'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '384m'
    maxParallelForks = 1
    def isolatedTemporaryRoot = layout.buildDirectory.dir('tmp/isolated-tests')
    systemProperty 'java.io.tmpdir', isolatedTemporaryRoot.get().asFile.absolutePath
    doFirst { isolatedTemporaryRoot.get().asFile.mkdirs() }
}

tasks.named('compileJava') {
    options.forkOptions.jvmArgs = ['-XX:ActiveProcessorCount=2']
    if (obfuscateEnabled) {
        // Emit standard StringBuilder + LDC instead of Java 9+ StringConcatFactory bootstrap recipes
        // so Skidfuscator + Stage 2b encrypt every concatenated string literal as well.
        options.compilerArgs.add('-XDstringConcat=inline')
    }
}
