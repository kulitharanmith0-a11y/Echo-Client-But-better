name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version number (e.g. 3.2)"
        required: true
        default: "3.2"
      tag:
        description: "Git tag name (leave empty for EchoclientV<version>)"
        required: false
        default: ""
      title:
        description: "Release title (leave empty for Echo Client V<version>)"
        required: false
        default: ""
      changelog:
        description: "Release notes in Markdown (leave empty to auto-generate from commits)"
        required: false
        default: ""
      force_update:
        description: "Force clients to install even if same/older version (hotfix/rollback)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build client JAR
        id: build
        env:
          CLIENT_VERSION: ${{ github.event.inputs.version }}
        run: |
          START_EPOCH=$(date +%s)
          chmod +x gradlew
          ./gradlew :build -Pclient_release="$CLIENT_VERSION" --no-daemon
          END_EPOCH=$(date +%s)
          ELAPSED=$((END_EPOCH - START_EPOCH))
          echo "elapsed_seconds=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "build_epoch=$END_EPOCH" >> "$GITHUB_OUTPUT"

      - name: Audit & Publish Release + Mirror + Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
          INPUT_FORCE: ${{ github.event.inputs.force_update }}
          ELAPSED_SECONDS: ${{ steps.build.outputs.elapsed_seconds }}
          BUILD_EPOCH: ${{ steps.build.outputs.build_epoch }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const { execFileSync } = require("child_process");

          const ECHO_BLUE_ICON_BASE64 =
            "";

          const jarPath = path.resolve("build/libs/Clumps-fabric-1.21.11-29.0.0.1.jar");
          if (!fs.existsSync(jarPath)) {
            throw new Error(`Built JAR not found at ${jarPath}`);
          }
          const jarBuffer = fs.readFileSync(jarPath);
          const sha256 = crypto.createHash("sha256").update(jarBuffer).digest("hex");
          const jarName = path.basename(jarPath);

          // 1. Sanity & Stealth Audit on the built JAR
          const listing = execFileSync("unzip", ["-Z1", jarPath], { encoding: "utf8" });
          const entries = listing.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
          const entrySet = new Set(entries);
          if (!entrySet.has("fabric.mod.json") || !entrySet.has("com/blamejared/clumps/client/ClumpsClient.class")) {
            throw new Error("Built JAR failed integrity check (missing fabric.mod.json or ClumpsClient.class).");
          }
          const badEntries = entries.filter((e) => /echo|dev\/dov|dev\/jadyen/i.test(e));
          if (badEntries.length > 0) {
            throw new Error(`Stealth audit failed: bad ZIP entries found: ${badEntries.join(", ")}`);
          }
          console.log(`JAR verified: ${jarName} (${jarBuffer.length} bytes, sha256=${sha256})`);

          const version = (process.env.INPUT_VERSION || "3.2").trim().replace(/^v/i, "");
          const tagName = (process.env.INPUT_TAG || "").trim() || `EchoclientV${version}`;
          const releaseTitle = (process.env.INPUT_TITLE || "").trim() || `Echo Client V${version}`;
          const forceUpdate = String(process.env.INPUT_FORCE || "false").toLowerCase() === "true";
          const buildTime = parseInt(process.env.BUILD_EPOCH || "0", 10) || Math.floor(Date.now() / 1000);
          const elapsedSecs = Math.max(1, parseInt(process.env.ELAPSED_SECONDS || "120", 10));
          const duration = elapsedSecs >= 60 ? `${Math.floor(elapsedSecs / 60)}m ${elapsedSecs % 60}s` : `${elapsedSecs}s`;

          let changelog = (process.env.INPUT_CHANGELOG || "").trim();
          if (!changelog) {
            let commits = "";
            try {
              const lastTag = execFileSync("git", ["describe", "--tags", "--abbrev=0"], { encoding: "utf8" }).trim();
              commits = execFileSync("git", ["log", `${lastTag}..HEAD`, "--pretty=format:- %s"], { encoding: "utf8" }).trim();
            } catch (_) {
              commits = execFileSync("git", ["log", "-n", "10", "--pretty=format:- %s"], { encoding: "utf8" }).trim();
            }
            const filtered = commits
              .split(/\r?\n/)
              .map((l) => l.replace(/\s*\[skip-discord\]/gi, "").trim())
              .filter(Boolean);
            changelog = `## ECHO CLIENT UPDATE v${version}\n\n${filtered.join("\n") || "- General improvements and bug fixes"}`;
          }

          function sanitizeAscii(text) {
            return String(text || "")
              .replace(/[`*_~]/g, "")
              .replace(/[\u2022\u00B7]/g, "|")
              .replace(/[\u2013\u2014]/g, "-")
              .replace(/[\u2018\u2019]/g, "'")
              .replace(/[\u201C\u201D]/g, '"')
              .replace(/[^\x20-\x7E]/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function parseReleaseNotesToChanges(body) {
            const changes = [];
            let currentSection = "";
            for (const rawLine of String(body || "").split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line) continue;
              if (/^#{1,4}\s+/.test(line)) {
                currentSection = sanitizeAscii(line.replace(/^#{1,4}\s+/, "")).toLowerCase();
                continue;
              }
              if (/^[-*~]\s+/.test(line)) {
                const cleaned = sanitizeAscii(line.replace(/^[-*~]\s+/, ""));
                if (!cleaned) continue;
                let title = cleaned;
                let detail = "";
                const colonIdx = cleaned.indexOf(":");
                if (colonIdx > 1 && colonIdx < 52) {
                  title = cleaned.slice(0, colonIdx).trim();
                  detail = cleaned.slice(colonIdx + 1).trim();
                }
                let tag = "UPD";
                const combined = (currentSection + " " + title + " " + detail).toLowerCase();
                if (currentSection.includes("new") || /\b(added|new module|introduced)\b/.test(combined)) {
                  tag = "NEW";
                } else if (currentSection.includes("fix") || /\b(fix|fixed|crash|bug|prevented|resolved)\b/.test(combined)) {
                  tag = "FIX";
                } else if (/\b(improv|optimiz|upgrad|enhanc|refactor|port|cleaner|faster)\b/.test(combined)) {
                  tag = "IMP";
                }
                changes.push({ tag, title, detail });
                if (changes.length >= 14) break;
              }
            }
            const summary = changes.length > 0
              ? changes.slice(0, 3).map((c) => c.title).join(", ")
              : "Latest improvements and bug fixes";
            return { summary, changes };
          }

          const repo = process.env.REPO;
          const token = process.env.GITHUB_TOKEN;
          const mirrorPat = (process.env.MIRROR_PAT || "").trim();
          const webhookUrl = (process.env.DISCORD_WEBHOOK_URL || "").trim().replace(/\/github\/?$/i, "");
          const shortSha = (process.env.HEAD_SHA || "").slice(0, 7);

          async function upsertReleaseAndAsset(targetRepo, authToken, tName, rTitle, rBody) {
            const headers = {
              "Authorization": `Bearer ${authToken}`,
              "Accept": "application/vnd.github+json",
              "User-Agent": "EchoClient-CloudRelease"
            };
            let rel = null;
            const getRes = await fetch(`https://api.github.com/repos/${targetRepo}/releases/tags/${encodeURIComponent(tName)}`, { headers });
            if (getRes.ok) {
              rel = await getRes.json();
              await fetch(`https://api.github.com/repos/${targetRepo}/releases/${rel.id}`, {
                method: "PATCH",
                headers: { ...headers, "Content-Type": "application/json" },
                body: JSON.stringify({ name: rTitle, body: rBody })
              });
            } else {
              const createRes = await fetch(`https://api.github.com/repos/${targetRepo}/releases`, {
                method: "POST",
                headers: { ...headers, "Content-Type": "application/json" },
                body: JSON.stringify({
                  tag_name: tName,
                  target_commitish: "main",
                  name: rTitle,
                  body: rBody,
                  draft: false,
                  prerelease: false
                })
              });
              if (!createRes.ok) {
                throw new Error(`Failed creating release on ${targetRepo}: ${createRes.status} ${await createRes.text()}`);
              }
              rel = await createRes.json();
            }

            if (Array.isArray(rel.assets)) {
              for (const a of rel.assets) {
                if (a && a.name === jarName) {
                  await fetch(`https://api.github.com/repos/${targetRepo}/releases/assets/${a.id}`, {
                    method: "DELETE",
                    headers
                  });
                }
              }
            }

            const uploadBase = String(rel.upload_url || "").replace(/\{\?name,label\}$/, "");
            const upRes = await fetch(`${uploadBase}?name=${encodeURIComponent(jarName)}`, {
              method: "POST",
              headers: {
                ...headers,
                "Content-Type": "application/java-archive",
                "Content-Length": String(jarBuffer.length)
              },
              body: jarBuffer
            });
            if (!upRes.ok) {
              throw new Error(`Failed uploading asset to ${targetRepo}: ${upRes.status} ${await upRes.text()}`);
            }
            const asset = await upRes.json();
            return { release: rel, asset };
          }

          (async () => {
            // 2. Publish to Private Repo
            const priv = await upsertReleaseAndAsset(repo, token, tagName, releaseTitle, changelog);
            console.log(`Published private release: ${priv.release.html_url}`);

            // 3. Mirror to Public Repo + latest.json
            if (mirrorPat) {
              const owner = repo.split("/")[0];
              const mirrorRepo = `${owner}/clumps-releases`;
              const pub = await upsertReleaseAndAsset(mirrorRepo, mirrorPat, tagName, `v${version}`, `Release v${version}`);
              const { summary, changes } = parseReleaseNotesToChanges(changelog);
              const latestObj = {
                version,
                buildTime,
                force: forceUpdate,
                sha256,
                url: pub.asset.browser_download_url,
                summary,
                changes
              };
              const mHeaders = {
                "Authorization": `Bearer ${mirrorPat}`,
                "Accept": "application/vnd.github+json",
                "User-Agent": "EchoClient-CloudRelease"
              };
              let existingSha = undefined;
              const fRes = await fetch(`https://api.github.com/repos/${mirrorRepo}/contents/latest.json`, { headers: mHeaders });
              if (fRes.ok) existingSha = (await fRes.json()).sha;

              const putBody = {
                message: `Update latest.json for v${version}`,
                content: Buffer.from(JSON.stringify(latestObj, null, 2) + "\n", "utf8").toString("base64")
              };
              if (existingSha) putBody.sha = existingSha;

              const pRes = await fetch(`https://api.github.com/repos/${mirrorRepo}/contents/latest.json`, {
                method: "PUT",
                headers: { ...mHeaders, "Content-Type": "application/json" },
                body: JSON.stringify(putBody)
              });
              if (!pRes.ok) {
                throw new Error(`Failed updating latest.json: ${pRes.status} ${await pRes.text()}`);
              }
              console.log(`Synced public mirror ${mirrorRepo} latest.json (v${version}, ${changes.length} items).`);
            }

            // 4. Post Echo Releases Discord Embed
            if (webhookUrl) {
              const runUrl = priv.release.html_url || `${process.env.SERVER_URL}/${repo}/actions/runs/${process.env.RUN_ID}`;
              const description = [
                `Client beta **${version}** has been published.`,
                `Built from \`${shortSha}\` | [run](${runUrl})`,
                `Took **${duration}**`
              ].join("\n");
              const payload = {
                username: "updates",
                embeds: [
                  {
                    author: { name: "Echo Releases", icon_url: "attachment://echo-blue.png" },
                    title: "Client beta updated",
                    description,
                    color: 0x3898FF,
                    timestamp: new Date().toISOString()
                  }
                ],
                attachments: [{ id: 0, filename: "echo-blue.png" }]
              };
              const form = new FormData();
              form.append("payload_json", JSON.stringify(payload));
              form.append("files[0]", new Blob([Buffer.from(ECHO_BLUE_ICON_BASE64, "base64")], { type: "image/png" }), "echo-blue.png");
              const dRes = await fetch(webhookUrl, { method: "POST", body: form });
              if (!dRes.ok) {
                throw new Error(`Discord release webhook failed (${dRes.status}): ${await dRes.text()}`);
              }
              console.log("Posted Echo Releases notification to Discord.");
            }
          })();
          EOF
