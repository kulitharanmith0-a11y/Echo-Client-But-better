name: Discord Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      title:
        description: "Update title (leave empty to use the latest commit)"
        required: false
        default: ""
      changelog:
        description: "Custom changelog text (leave empty to use the latest commit)"
        required: false
        default: ""

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Post changelog to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          let webhookUrl = (process.env.DISCORD_WEBHOOK_URL || "").trim();
          if (!webhookUrl) {
            console.error("DISCORD_WEBHOOK_URL secret is missing or empty.");
            process.exit(1);
          }
          webhookUrl = webhookUrl.replace(/\/github\/?$/i, "");

          const eventPath = process.env.GITHUB_EVENT_PATH;
          const event = eventPath && fs.existsSync(eventPath)
            ? JSON.parse(fs.readFileSync(eventPath, "utf8"))
            : {};

          const eventName = process.env.EVENT_NAME || "";
          let targetSha = (process.env.HEAD_SHA || "").trim();
          let shortSha = targetSha.slice(0, 7);
          let title = (process.env.INPUT_TITLE || "").trim();
          let description = (process.env.INPUT_CHANGELOG || "").trim();

          if (!description) {
            let visibleCommits = [];

            if (eventName === "push") {
              const commits = Array.isArray(event.commits) ? event.commits : [];
              visibleCommits = commits.filter(
                (c) => c && typeof c.message === "string" && !c.message.includes("[skip-discord]")
              );
              if (visibleCommits.length === 0 && event.head_commit && event.head_commit.message) {
                if (!event.head_commit.message.includes("[skip-discord]")) {
                  visibleCommits.push(event.head_commit);
                }
              }
            } else {
              const rawLog = execFileSync(
                "git",
                ["log", "-n", "10", "--format=%H%x1f%B%x1e"],
                { encoding: "utf8" }
              );
              const entries = rawLog
                .split("\x1e")
                .map((s) => s.trim())
                .filter(Boolean);
              for (const entry of entries) {
                const idx = entry.indexOf("\x1f");
                if (idx === -1) continue;
                const sha = entry.slice(0, idx).trim();
                const message = entry.slice(idx + 1).trim();
                if (!message || message.includes("[skip-discord]")) continue;
                targetSha = sha;
                shortSha = sha.slice(0, 7);
                visibleCommits.push({ message });
                break;
              }
            }

            if (visibleCommits.length === 0) {
              console.log("No changelog commits to post (skipped).");
              process.exit(0);
            }

            if (visibleCommits.length === 1) {
              const raw = visibleCommits[0].message.trim();
              const lines = raw.split(/\r?\n/);
              const subject = lines[0].trim();
              const body = lines.slice(1).join("\n").trim();
              title = title || subject || "Echo Client Update";
              description = body || `~ ${subject}`;
            } else {
              title = title || `Echo Client Update (${visibleCommits.length} commits)`;
              description = visibleCommits
                .map((c) => {
                  const lines = c.message.trim().split(/\r?\n/);
                  const subject = lines[0].trim();
                  const body = lines.slice(1).join("\n").trim();
                  return body ? `**~ ${subject}**\n${body}` : `~ ${subject}`;
                })
                .join("\n\n");
            }
          } else {
            title = title || "Echo Client Update";
          }

          // Compute exact lines added / removed / files changed via git numstat
          function computeDiffStats() {
            const zeroSha = /^0+$/;
            let output = "";
            try {
              if (eventName === "push" && event.before && !zeroSha.test(event.before) && event.after) {
                output = execFileSync("git", ["diff", "--numstat", `${event.before}..${event.after}`], {
                  encoding: "utf8"
                });
              } else if (targetSha) {
                output = execFileSync("git", ["show", "--numstat", "--format=", targetSha], {
                  encoding: "utf8"
                });
              }
            } catch (err) {
              try {
                output = execFileSync("git", ["show", "--numstat", "--format=", "HEAD"], {
                  encoding: "utf8"
                });
              } catch (_) {
                return null;
              }
            }

            let files = 0;
            let added = 0;
            let removed = 0;
            for (const line of output.split(/\r?\n/)) {
              if (!line.trim()) continue;
              const parts = line.split("\t");
              if (parts.length < 3) continue;
              files++;
              const addVal = parseInt(parts[0], 10);
              const delVal = parseInt(parts[1], 10);
              if (!Number.isNaN(addVal)) added += addVal;
              if (!Number.isNaN(delVal)) removed += delVal;
            }
            return { files, added, removed };
          }

          const stats = computeDiffStats();

          if (title.length > 256) {
            title = title.slice(0, 253) + "...";
          }
          if (description.length > 4000) {
            description = description.slice(0, 3997) + "...";
          }

          const fields = [];
          if (stats && stats.files > 0) {
            fields.push(
              { name: "Lines Added", value: `\`+${stats.added.toLocaleString("en-US")}\``, inline: true },
              { name: "Lines Removed", value: `\`-${stats.removed.toLocaleString("en-US")}\``, inline: true },
              { name: "Files Changed", value: `\`${stats.files}\``, inline: true }
            );
          }

          const payload = {
            username: "Echo Client",
            embeds: [
              {
                title,
                description,
                color: 0x10B981,
                fields,
                footer: {
                  text: shortSha ? `Echo Client • ${shortSha}` : "Echo Client"
                },
                timestamp: new Date().toISOString()
              }
            ]
          };

          (async () => {
            const res = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (!res.ok) {
              const text = await res.text();
              console.error(`Discord webhook failed (${res.status}): ${text}`);
              process.exit(1);
            }
            console.log("Posted changelog to Discord successfully.", stats);
          })();
          EOF
